[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whispercatch-sentinel"
version = "0.1.0"
description = "Headless tactical SIGINT and C-UAS edge sensor node backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"whispercatch_sentinel.dashboard" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/vendor/leaflet/*",
    "static/vendor/leaflet/images/*",
]
